<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Play-by-Play Feed</title>
<script>
/* ===== EDIT THESE ===== */
const CONFIG = {
  league: "football/nfl",   // football/nfl | basketball/nba | baseball/mlb | hockey/nhl |
                            // football/college-football | basketball/mens-college-basketball |
                            // basketball/wnba | basketball/womens-college-basketball
  team: "KC",               // team abbreviation to follow (KC, LAL, NYY, BOS...). "" = first live game
  eventId: "",              // optional: exact ESPN game id (the number in an espn.com game URL)
  pollSeconds: 10,          // how often to check for new plays
  maxPlays: 6,              // how many plays to show
  accent: "#00e5ff",        // match your other overlay files
  accent2: "#ff2bd6",
  demo: false               // true = fake plays, for positioning the box in Streamlabs
};
</script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--a:#00e5ff;--b:#ff2bd6}
  html,body{margin:0;width:480px;height:560px;overflow:hidden;background:transparent;
    font-family:Montserrat,Arial,sans-serif;color:#fff}
  .panel{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px}
  .head{background:rgba(10,10,20,.9);border-radius:10px;border-left:6px solid var(--a);padding:12px 16px}
  .label{font-size:13px;font-weight:800;letter-spacing:2px;color:var(--a)}
  .score{font-size:26px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .detail{font-size:15px;opacity:.8;margin-top:2px}
  .list{display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .play{display:flex;gap:10px;align-items:flex-start;background:rgba(10,10,20,.85);border-radius:8px;
    padding:10px 12px;border-left:4px solid rgba(255,255,255,.25);font-size:17px;line-height:1.3}
  .play.new{animation:slide .6s ease-out}
  @keyframes slide{from{opacity:0;transform:translateX(40px);box-shadow:0 0 24px var(--a)}to{opacity:1;transform:none}}
  .tag{flex:none;font-size:13px;font-weight:800;background:rgba(255,255,255,.12);border-radius:4px;padding:3px 6px;margin-top:1px}
  .play.scoring{border-left-color:var(--b);background:rgba(40,8,36,.9)}
  .play.scoring .tag{background:var(--b);color:#000}
  .txt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .status{font-size:12px;opacity:.6;padding-left:4px}
</style>
</head>
<body>
<div class="panel">
  <div class="head">
    <div class="label">PLAY-BY-PLAY</div>
    <div class="score" id="score">Loading game…</div>
    <div class="detail" id="detail"></div>
  </div>
  <div class="list" id="list"></div>
  <div class="status" id="status"></div>
</div>
<script>
const C = CONFIG, $ = id => document.getElementById(id);
document.documentElement.style.setProperty('--a', C.accent);
document.documentElement.style.setProperty('--b', C.accent2);
const BASE = "https://site.api.espn.com/apis/site/v2/sports/";
let shown = new Set(), firstRender = true, currentEvent = null;

async function getJSON(url){
  const r = await fetch(url, {cache: "no-store"});
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

// Pick the game to follow from today's scoreboard: live first, then upcoming, then finished.
async function findEvent(){
  if (C.eventId) return {id: String(C.eventId)};
  const sb = await getJSON(BASE + C.league + "/scoreboard");
  const team = C.team.trim().toUpperCase();
  const events = (sb.events || []).filter(e => !team ||
    (e.competitions?.[0]?.competitors || []).some(c => (c.team?.abbreviation || "").toUpperCase() === team));
  const state = e => e.status?.type?.state;
  return events.find(e => state(e) === "in") || events.find(e => state(e) === "pre") || events[0] || null;
}

function periodTag(p){
  const n = p.period?.number, sport = C.league.split("/")[0];
  if (sport === "baseball") return p.period?.displayValue || (n ? "Inn " + n : "");
  if (!n) return "";
  if (sport === "hockey") return n > 3 ? "OT" : "P" + n;
  if (C.league.includes("college-basketball")) return n > 2 ? "OT" : "H" + n;
  return n > 4 ? "OT" : "Q" + n;
}

// ESPN puts plays in different places per sport: basketball/hockey/baseball use `plays`,
// football groups them into drives. All arrive oldest-first.
function extractPlays(d){
  let raw = [];
  if (Array.isArray(d.plays) && d.plays.length) raw = d.plays;
  else if (d.drives) {
    (d.drives.previous || []).forEach(dr => raw.push(...(dr.plays || [])));
    raw.push(...(d.drives.current?.plays || []));
  } else if (Array.isArray(d.scoringPlays)) raw = d.scoringPlays;
  const seen = new Set(), out = [];
  for (const p of raw) {
    const text = (p.text || "").trim();
    if (!text) continue;
    const id = String(p.id ?? (p.sequenceNumber + text));
    if (seen.has(id)) continue;
    seen.add(id);
    out.push({id, text, scoring: !!p.scoringPlay,
      tag: [periodTag(p), p.clock?.displayValue].filter(Boolean).join(" ")});
  }
  return out;
}

function renderHeader(comp){
  const teams = comp?.competitors || [];
  const away = teams.find(t => t.homeAway === "away") || teams[0];
  const home = teams.find(t => t.homeAway === "home") || teams[1];
  const ab = t => t?.team?.abbreviation || "";
  const state = comp?.status?.type?.state;
  $("score").textContent = state === "pre" ? `${ab(away)} @ ${ab(home)}`
    : `${ab(away)} ${away?.score ?? ""}  —  ${home?.score ?? ""} ${ab(home)}`;
  $("detail").textContent = comp?.status?.type?.shortDetail || "";
  return state;
}

function renderPlays(plays){
  const list = $("list");
  const latest = plays.slice(-C.maxPlays).reverse();
  list.innerHTML = "";
  for (const p of latest) {
    const el = document.createElement("div");
    el.className = "play" + (p.scoring ? " scoring" : "") + (!firstRender && !shown.has(p.id) ? " new" : "");
    const tag = document.createElement("span");
    tag.className = "tag"; tag.textContent = p.scoring ? "SCORE" + (p.tag ? " " + p.tag : "") : (p.tag || "•");
    const txt = document.createElement("span");
    txt.className = "txt"; txt.textContent = p.text;
    el.append(tag, txt);
    list.append(el);
  }
  plays.forEach(p => shown.add(p.id));
  firstRender = false;
}

async function poll(){
  try {
    const ev = await findEvent();
    if (!ev) {
      $("score").textContent = C.team ? `No ${C.team.toUpperCase()} game today` : "No games today";
      $("detail").textContent = ""; $("list").innerHTML = ""; $("status").textContent = "";
      return;
    }
    if (ev.id !== currentEvent) { currentEvent = ev.id; shown = new Set(); firstRender = true; }
    const d = await getJSON(BASE + C.league + "/summary?event=" + ev.id);
    const state = renderHeader(d.header?.competitions?.[0] || ev.competitions?.[0]);
    const plays = extractPlays(d);
    if (plays.length) renderPlays(plays);
    else $("list").innerHTML = state === "pre"
      ? '<div class="play"><span class="txt">Play-by-play starts at game time.</span></div>' : "";
    $("status").textContent = "";
  } catch (err) {
    console.error("Play-by-play update failed:", err);
    $("status").textContent = "Reconnecting…";   // keep the last plays on screen
  }
}

function demo(){
  const script = [
    ["Q3 8:41", "P.Mahomes pass short right to T.Kelce for 12 yards (T.Bernard)."],
    ["Q3 8:02", "I.Pacheco left tackle to BUF 31 for 6 yards."],
    ["Q3 7:20", "P.Mahomes pass deep left to X.Worthy for 31 yards, TOUCHDOWN.", true],
    ["Q3 7:16", "H.Butker extra point is GOOD."],
    ["Q3 7:16", "H.Butker kicks 65 yards from KC 35 to end zone, Touchback."],
    ["Q3 7:10", "J.Allen pass incomplete short left to K.Coleman."],
    ["Q3 7:04", "J.Cook up the middle to BUF 32 for 7 yards."]
  ];
  let i = 0, plays = [];
  $("score").textContent = "BUF 17  —  24 KC"; $("detail").textContent = "3rd Quarter (demo)";
  const step = () => {
    const [tag, text, scoring] = script[i % script.length];
    plays.push({id: "demo" + i, tag, text, scoring: !!scoring}); i++;
    renderPlays(plays);
  };
  for (let k = 0; k < 3; k++) step();
  setInterval(step, 3000);
}

if (C.demo) demo();
else { poll(); setInterval(poll, Math.max(5, C.pollSeconds) * 1000); }
</script>
</body>
</html>
